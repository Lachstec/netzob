[build-system]
requires = ["setuptools<82", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netzob"
requires-python = ">=3.13"
dynamic = ["version", "description", "readme", "license", "authors", "keywords", "classifiers", "scripts"]
dependencies = [
    "getmac>=0.9",
    "bintrees>=2.2",
    "bitarray>=3.8",
    "colorama>=0.4",
    "pylstar>=0.1.2",
    "impacket>=0.12",
    "netaddr>=1.0",
    "pcapy-ng>=1.0",
    "pythoncrc",
    "numpy>=2.1",
]

[project.optional-dependencies]
docs = ["sphinx>=7", "sphinx-book-theme"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["src/netzob"]
addopts = [
    "--doctest-modules",
    "--ignore=src/netzob/Inference/Grammar/GrammarInferer.py",
    "--ignore=src/netzob/Inference/Vocabulary/FormatOperations/_AsciiAlign.py",
]
